name: Render API

on:
  push:
    paths: ['apps/render-api/**', '.github/workflows/render-api.yml']
  pull_request:
    paths: ['apps/render-api/**', '.github/workflows/render-api.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.31
      - run: uv sync --project apps/render-api --locked
      - run: uv run --project apps/render-api --locked ruff check apps/render-api
      - run: uv run --project apps/render-api --locked ruff format --check apps/render-api
      # Native integration runs locally when a release executable is available. The Rust
      # workspace has its own build/test workflow; this matrix exercises wrapper behavior.
      - run: uv run --project apps/render-api --locked pytest apps/render-api/tests -q
